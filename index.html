<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisório - Sistema de Nível SESI</title>
    <!-- Biblioteca Paho MQTT para conexão via WebSocket no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #0056b3; margin-bottom: 5px; }
        .subtitulo { color: #666; font-size: 14px; margin-bottom: 25px; }
        .status-conexao {
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .desconectado { background-color: #f8d7da; color: #721c24; }
        .conectado { background-color: #d4edda; color: #155724; }
        
        .card {
            background: #f8f9fa;
            border-left: 6px solid #6c757d;
            margin: 15px 0;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card-titulo { font-size: 13px; color: #666; text-transform: uppercase; font-weight: bold; }
        .card-valor { font-size: 24px; font-weight: bold; margin-top: 5px; color: #333; }
        
        .nivel-cheio { border-left-color: #28a745; }
        .nivel-baixo { border-left-color: #ffc107; }
        .nivel-erro { border-left-color: #dc3545; }
        
        .motor-ligado { border-left-color: #28a745; background-color: #e8f5e9; }
        .motor-desligado { border-left-color: #6c757d; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Supervisório IoT - SESI</h2>
        <div class="subtitulo">Monitoramento de Reservatório & RFID em Tempo Real</div>

        <div>
            Status da Conexão: <span id="span-conexao" class="status-conexao desconectado">Desconectado</span>
        </div>

        <!-- Card Nível -->
        <div class="card nivel-baixo" id="card-nivel">
            <div class="card-titulo">Status do Nível / Alarme</div>
            <div class="card-valor" id="val-nivel">Aguardando dados...</div>
        </div>

        <!-- Card Motor -->
        <div class="card motor-desligado" id="card-motor">
            <div class="card-titulo">Estado do Motor</div>
            <div class="card-valor" id="val-motor">DESLIGADO</div>
        </div>

        <!-- Card RFID -->
        <div class="card" style="border-left-color: #17a2b8;">
            <div class="card-titulo">Última Tag RFID Detectada</div>
            <div class="card-valor" id="val-rfid" style="font-family: monospace; color: #17a2b8;">Nenhuma tag lida</div>
        </div>
    </div>

    <script>
        const brokerHost = "broker.hivemq.com";
        const brokerPort = 8000;
        const clientId = "supervisorio_sesi_" + Math.random().toString(16).substring(2, 8);

        const topicoNivel = "sesi349/bebedouro/nivel";
        const topicoMotor = "sesi349/bebedouro/motor";
        const topicoRfid  = "sesi349/bebedouro/rfid";

        client = new Paho.MQTT.Client(brokerHost, Number(brokerPort), clientId);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({ onSuccess: onConnect, onFailure: onFailure });

        function onConnect() {
            let spanConexao = document.getElementById("span-conexao");
            spanConexao.innerText = "Conectado";
            spanConexao.className = "status-conexao conectado";

            client.subscribe(topicoNivel);
            client.subscribe(topicoMotor);
            client.subscribe(topicoRfid);
        }

        function onFailure(response) {
            console.log("Falha na conexão: " + response.errorMessage);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                let spanConexao = document.getElementById("span-conexao");
                spanConexao.innerText = "Desconectado";
                spanConexao.className = "status-conexao desconectado";
            }
        }

        function onMessageArrived(message) {
            let payload = message.payloadString;

            if (message.destinationName === topicoNivel) {
                document.getElementById("val-nivel").innerText = payload;
                let cardNivel = document.getElementById("card-nivel");
                
                if (payload.includes("CHEIO")) {
                    cardNivel.className = "card nivel-cheio";
                } else if (payload.includes("ERRO")) {
                    cardNivel.className = "card nivel-erro";
                } else {
                    cardNivel.className = "card nivel-baixo";
                }
            } 
            else if (message.destinationName === topicoMotor) {
                document.getElementById("val-motor").innerText = payload;
                let cardMotor = document.getElementById("card-motor");
                
                if (payload === "LIGADO") {
                    cardMotor.className = "card motor-ligado";
                } else {
                    cardMotor.className = "card motor-desligado";
                }
            } 
            else if (message.destinationName === topicoRfid) {
                document.getElementById("val-rfid").innerText = "ID: " + payload;
            }
        }
    </script>
</body>
</html>
